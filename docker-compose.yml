# Local observability for coding-agent acceptance.
# UI: http://localhost:16686
# Host OTLP (mapped to avoid common 4317/4318 collisions): HTTP 14318, gRPC 14317
services:
  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    ports:
      - "16686:16686"
      - "14317:4317"
      - "14318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_HEADERS: "*"
